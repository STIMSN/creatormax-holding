<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreatorMax</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<style>
  :root { --bg:#fafaf9; --ink:#111; --muted:#6b6b6b; --line:#e7e5e4; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; padding:24px 16px; }
  main { max-width:420px; text-align:center; }
  img { width:56px; height:56px; margin-bottom:24px; }
  h1 { font-size:28px; letter-spacing:-0.02em; margin-bottom:8px; }
  .tag { color:var(--muted); margin-bottom:32px; }
  .card { border:1px solid var(--line); border-radius:12px; padding:20px; background:#fff; }
  .card p + p { margin-top:8px; color:var(--muted); font-size:14px; }
  a { color:inherit; }
</style>
</head>
<body>
<main>
  <img src="icon.svg" alt="">
  <h1>CreatorMax</h1>
  <p class="tag">Creator marketing, maxed out.</p>
  <div class="card">
    <p><strong>We're down for maintenance.</strong></p>
    <p>We'll be back shortly. Questions? <a href="mailto:ethan@stimsn.com">ethan@stimsn.com</a></p>
  </div>
</main>
</body>
</html>
